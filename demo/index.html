  </head>
  <body>
    <div class="top">
      <nav class="in nav" aria-label="Primary">
        <a class="wordmark" href="/">bappy</a>
        <div class="nav-links">
          <a href="/#how">How it works</a>
          <a href="/results">Results</a>
          <a href="/seat">What a seat includes</a>
        </div>
        <a class="nav-login" href="https://app.bappy.ai">Log in</a>
        <a class="btn btn-yellow" href="/demo">Book a demo</a>
      </nav>
      <header class="in n-head"><h1>Book a demo</h1><p>30 minutes. We'll show you Bappy running a shop.</p></header>
    </div>
    <main>
<section class="n-sec"><div class="in"><div class="n-form"><div class="n-q" data-q="brokers"><b>How many brokers do you have?</b><div class="n-chips"><button type="button" class="n-chip" aria-pressed="false">1 to 3</button><button type="button" class="n-chip" aria-pressed="false">4 to 10</button><button type="button" class="n-chip" aria-pressed="false">11 to 25</button><button type="button" class="n-chip" aria-pressed="false">More than 25</button></div></div><div class="n-q" data-q="heard"><b>How did you hear about Bappy?</b><div class="n-chips"><button type="button" class="n-chip" aria-pressed="false">Another shop</button><button type="button" class="n-chip" aria-pressed="false">WhatsApp</button><button type="button" class="n-chip" aria-pressed="false">Google</button><button type="button" class="n-chip" aria-pressed="false">An event</button><button type="button" class="n-chip" aria-pressed="false">Other</button></div></div><button type="button" class="btn btn-yellow n-go" id="n-go" disabled>Pick a time</button><noscript><a class="n-link" href="https://calendar.app.google/cBcp1Tieexc2Khy58">Pick a time</a></noscript></div></div></section>
</main>
    <footer class="end" style="padding-top: 0">
      
      <div class="in foot" style="margin-top: 0">
        <span class="wordmark">bappy</span>
        <p></p>
        <span class="n-foot"><a href="/results">Results</a><a href="/seat">What a seat includes</a><a href="/your-own-ai-bot">Bappy and your own AI bot</a></span>
        <a href="mailto:mendy@bappy.ai">mendy@bappy.ai</a>
        <a href="/privacy">Privacy</a>
        <a href="/terms">Texting terms</a>
      </div>
    </footer>
    <script>
      (function () {
        var go = document.getElementById("n-go"), pick = {};
        document.querySelectorAll(".n-q").forEach(function (q) {
          q.addEventListener("click", function (e) {
            var c = e.target.closest(".n-chip");
            if (!c) return;
            q.querySelectorAll(".n-chip").forEach(function (x) { x.setAttribute("aria-pressed", x === c); });
            pick[q.dataset.q] = c.textContent;
            go.disabled = !(pick.brokers && pick.heard);
          });
        });
        go.addEventListener("click", function () {
          try { window.va("event", { name: "Pick a time", data: pick }); } catch (e) {}
          setTimeout(function () { location.href = "https://calendar.app.google/cBcp1Tieexc2Khy58"; }, 250);
        });
      })();
    </script>
  </body>
